version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: monthly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: gomod
    directory: "/frankenphp/extension"
    schedule:
      interval: monthly
    groups:
      go-deps:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: "/frankenphp"
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ["*"]
